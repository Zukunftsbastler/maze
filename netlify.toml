[build]
  # Nur die Laufzeitdateien werden veröffentlicht. Prompts, Design-Notizen, Lore, README,
  # zone-map-editor.html und validate-artifacts.js (Node-Werkzeug) bleiben im Repo.
  # Neue Laufzeitdateien (außer *.js) müssen hier ergänzt werden.
  command = "rm -rf dist && mkdir dist && cp index.html panoptikum.css *.js dist/ && rm dist/validate-artifacts.js && cp -R ASSETS dist/"
  publish = "dist"

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Skripte nur aus eigenen Dateien (das frühere Inline-Skript liegt jetzt in main.js).
    # 'unsafe-inline' bleibt nur für Styles: index.html und die JS-Templates nutzen style-Attribute.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"

# Cache-Header für JS-Dateien
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
